name: projecthub

services:
  db:
    container_name: projecthub-db
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - projecthub-pgdata:/var/lib/postgresql/data
    networks:
      - projecthub-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    container_name: projecthub-backend
    image: projecthub-backend:v1.0.0
    build:
      context: .
      dockerfile: backend/Containerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      PORT: "5000"
      NODE_ENV: production
      TRUST_PROXY_HOPS: "1"
      COOKIE_SECURE: auto
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      RUN_MIGRATIONS_ON_START: "true"
    networks:
      - projecthub-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');h.get('http://127.0.0.1:5000/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    container_name: projecthub-frontend
    image: projecthub-frontend:v1.0.0
    build:
      context: .
      dockerfile: frontend/Containerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - projecthub-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  projecthub-net:
    name: projecthub-net
    driver: bridge

volumes:
  projecthub-pgdata:
    name: projecthub-pgdata
